services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/whatsapp-booking-bot
    ports:
      - '3000:3000'
    depends_on:
      - mongo

volumes:
  mongo-data:
